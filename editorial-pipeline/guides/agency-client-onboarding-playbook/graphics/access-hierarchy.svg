<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Client access hierarchy</title><desc id="desc">A three-level hierarchy prioritizing delegated access, then role-based access, then shared credentials only when unavoidable.</desc>
<rect width="1200" height="600" rx="36" fill="#FBFAF7"/>
<text x="64" y="72" font-family="Arial" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">ACCESS & SECURITY</text>
<text x="64" y="118" font-family="Arial" font-size="38" font-weight="800" fill="#111">Request the minimum access needed for the work.</text>
<text x="64" y="154" font-family="Arial" font-size="18" fill="#666">Prefer delegated or role-based access. Shared credentials should be the exception.</text>
<g transform="translate(92,220)"><rect width="1016" height="112" rx="28" fill="#E9F3DE" stroke="#C5D5A8"/><circle cx="66" cy="56" r="32" fill="#6F8A48"/><text x="66" y="64" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#FFF">1</text><text x="120" y="48" font-family="Arial" font-size="26" font-weight="800" fill="#111">Delegated / collaborator access</text><text x="120" y="78" font-family="Arial" font-size="17" fill="#444">Best option when supported: Shopify collaborator, Meta partner, Google Ads manager, CMS user roles.</text><rect x="820" y="36" width="150" height="38" rx="19" fill="#FFF"/><text x="895" y="61" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#587137">PREFERRED</text></g>
<g transform="translate(154,352)"><rect width="892" height="96" rx="25" fill="#FFF" stroke="#D8D3CA"/><circle cx="58" cy="48" r="29" fill="#9AA57A"/><text x="58" y="56" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFF">2</text><text x="108" y="42" font-family="Arial" font-size="24" font-weight="800" fill="#111">Role-based team access</text><text x="108" y="70" font-family="Arial" font-size="16" fill="#444">Give team members the role they need instead of one broad account shared by everyone.</text></g>
<g transform="translate(226,468)"><rect width="748" height="76" rx="22" fill="#111"/><circle cx="50" cy="38" r="25" fill="#4B4B4B"/><text x="50" y="45" text-anchor="middle" font-family="Arial" font-size="19" font-weight="800" fill="#FFF">3</text><text x="94" y="34" font-family="Arial" font-size="21" font-weight="800" fill="#FFF">Shared credential only if unavoidable</text><text x="94" y="58" font-family="Arial" font-size="15" fill="#D7D7D7">Use a controlled password manager or secure method - not ordinary chat or spreadsheets.</text></g>
</svg>