<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">30-day onboarding roadmap</title><desc id="desc">A seven-stage roadmap from agreement and intake through kickoff, first progress, structured review, rhythm stabilization, and onboarding retrospective.</desc>
<rect width="1200" height="600" rx="36" fill="#FBFAF7"/>
<text x="64" y="72" font-family="Arial" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">FIRST 30 DAYS</text>
<text x="64" y="118" font-family="Arial" font-size="38" font-weight="800" fill="#111">Make progress visible before the client needs to ask.</text>
<line x1="100" y1="296" x2="1100" y2="296" stroke="#D6D0C6" stroke-width="10" stroke-linecap="round"/>
<g font-family="Arial">
<g transform="translate(76,212)"><circle cx="50" cy="84" r="34" fill="#111"/><text x="50" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#FFF">DAY 0</text><text x="50" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Agreement</text><text x="50" y="164" text-anchor="middle" font-size="13" fill="#666">Welcome + owners</text></g>
<g transform="translate(228,212)"><circle cx="50" cy="84" r="34" fill="#758952"/><text x="50" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF">D1-3</text><text x="50" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Intake</text><text x="50" y="164" text-anchor="middle" font-size="13" fill="#666">Info + access</text></g>
<g transform="translate(380,212)"><circle cx="50" cy="84" r="34" fill="#98A878"/><text x="50" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF">D2-5</text><text x="50" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Kickoff</text><text x="50" y="164" text-anchor="middle" font-size="13" fill="#666">Rules + first milestone</text></g>
<g transform="translate(532,212)"><circle cx="50" cy="84" r="34" fill="#62749A"/><text x="50" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF">W1</text><text x="50" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Visible progress</text><text x="50" y="164" text-anchor="middle" font-size="13" fill="#666">First meaningful output</text></g>
<g transform="translate(684,212)"><circle cx="50" cy="84" r="34" fill="#7A6B9D"/><text x="50" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF">W2</text><text x="50" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Review</text><text x="50" y="164" text-anchor="middle" font-size="13" fill="#666">Feedback + decisions</text></g>
<g transform="translate(836,212)"><circle cx="50" cy="84" r="34" fill="#A16E65"/><text x="50" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF">W3</text><text x="50" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Stabilize</text><text x="50" y="164" text-anchor="middle" font-size="13" fill="#666">Fix recurring friction</text></g>
<g transform="translate(988,212)"><circle cx="50" cy="84" r="34" fill="#111"/><text x="50" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#FFF">W4</text><text x="50" y="140" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Retrospective</text><text x="50" y="164" text-anchor="middle" font-size="13" fill="#666">Improve the SOP</text></g>
</g>
<g transform="translate(64,430)"><rect width="1072" height="92" rx="22" fill="#111"/><text x="30" y="38" font-family="Arial" font-size="15" font-weight="700" fill="#DDE9BC">THE OPERATING QUESTION</text><text x="30" y="68" font-family="Arial" font-size="21" font-weight="700" fill="#FFF">Does the client know what happened, what is happening now, and what happens next?</text></g>
</svg>