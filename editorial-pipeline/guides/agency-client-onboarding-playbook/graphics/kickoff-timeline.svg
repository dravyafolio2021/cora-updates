<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">35-minute kickoff agenda</title><desc id="desc">A six-step 35-minute kickoff timeline covering context, scope, access, communication, first milestone, and closing actions.</desc>
<rect width="1200" height="540" rx="36" fill="#FBFAF7"/>
<text x="64" y="72" font-family="Arial" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">KICKOFF MEETING</text>
<text x="64" y="118" font-family="Arial" font-size="38" font-weight="800" fill="#111">Use kickoff to make decisions - not to repeat the sales call.</text>
<line x1="94" y1="272" x2="1104" y2="272" stroke="#CFC9BF" stroke-width="8" stroke-linecap="round"/>
<g font-family="Arial">
<g transform="translate(86,202)"><circle cx="42" cy="70" r="34" fill="#111"/><text x="42" y="78" text-anchor="middle" font-size="19" font-weight="800" fill="#FFF">0-5</text><text x="42" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Why now?</text><text x="42" y="150" text-anchor="middle" font-size="13" fill="#666">Outcome + context</text></g>
<g transform="translate(274,202)"><circle cx="42" cy="70" r="34" fill="#7A8E54"/><text x="42" y="78" text-anchor="middle" font-size="17" font-weight="800" fill="#FFF">5-12</text><text x="42" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Scope</text><text x="42" y="150" text-anchor="middle" font-size="13" fill="#666">Roles + boundaries</text></g>
<g transform="translate(462,202)"><circle cx="42" cy="70" r="34" fill="#A2AE82"/><text x="42" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#FFF">12-20</text><text x="42" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Access</text><text x="42" y="150" text-anchor="middle" font-size="13" fill="#666">Inputs + blockers</text></g>
<g transform="translate(650,202)"><circle cx="42" cy="70" r="34" fill="#7E8CAB"/><text x="42" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#FFF">20-27</text><text x="42" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Operating rules</text><text x="42" y="150" text-anchor="middle" font-size="13" fill="#666">Updates + approvals</text></g>
<g transform="translate(838,202)"><circle cx="42" cy="70" r="34" fill="#525F78"/><text x="42" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#FFF">27-33</text><text x="42" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#111">First milestone</text><text x="42" y="150" text-anchor="middle" font-size="13" fill="#666">Owner + date</text></g>
<g transform="translate(1026,202)"><circle cx="42" cy="70" r="34" fill="#111"/><text x="42" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#FFF">33-35</text><text x="42" y="126" text-anchor="middle" font-size="17" font-weight="800" fill="#111">Close</text><text x="42" y="150" text-anchor="middle" font-size="13" fill="#666">Actions + owners</text></g>
</g>
<rect x="64" y="424" width="1072" height="64" rx="18" fill="#FFF" stroke="#DDD8CF"/><text x="92" y="463" font-family="Arial" font-size="18" font-weight="700" fill="#111">Kickoff success = everyone leaves knowing what happens next, who owns it, and when it is due.</text>
</svg>