<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Scope change decision tree</title><desc id="desc">A decision tree for classifying client requests as clarification, revision, substitution, or additional scope.</desc>
<rect width="1200" height="640" rx="36" fill="#FBFAF7"/>
<text x="64" y="72" font-family="Arial" font-size="18" font-weight="700" fill="#6B7280" letter-spacing="2">SCOPE CONTROL</text>
<text x="64" y="118" font-family="Arial" font-size="38" font-weight="800" fill="#111">Classify the request before the team says yes.</text>
<g transform="translate(455,154)"><rect width="290" height="82" rx="24" fill="#111"/><text x="145" y="34" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#DDE9BC">NEW CLIENT REQUEST</text><text x="145" y="60" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#FFF">What kind of change is this?</text></g>
<path d="M600 236 V290 M600 290 H185 M600 290 H1015" stroke="#B5B0A6" stroke-width="4" fill="none"/>
<path d="M185 290 V330 M465 290 V330 M735 290 V330 M1015 290 V330" stroke="#B5B0A6" stroke-width="4"/>
<g transform="translate(65,330)"><rect width="240" height="190" rx="24" fill="#FFF" stroke="#D8D3CA"/><text x="24" y="40" font-family="Arial" font-size="13" font-weight="700" fill="#777">01 CLARIFICATION</text><text x="24" y="78" font-family="Arial" font-size="24" font-weight="800" fill="#111">Already included</text><text x="24" y="116" font-family="Arial" font-size="16" fill="#444">Client needs explanation or</text><text x="24" y="140" font-family="Arial" font-size="16" fill="#444">support around agreed work.</text><rect x="24" y="154" width="122" height="24" rx="12" fill="#EDF7E7"/><text x="85" y="171" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#51733D">HANDLE IN SCOPE</text></g>
<g transform="translate(345,330)"><rect width="240" height="190" rx="24" fill="#FFF" stroke="#D8D3CA"/><text x="24" y="40" font-family="Arial" font-size="13" font-weight="700" fill="#777">02 REVISION</text><text x="24" y="78" font-family="Arial" font-size="24" font-weight="800" fill="#111">Adjust agreed work</text><text x="24" y="116" font-family="Arial" font-size="16" fill="#444">Change stays inside the</text><text x="24" y="140" font-family="Arial" font-size="16" fill="#444">revision policy.</text><rect x="24" y="154" width="130" height="24" rx="12" fill="#FFF2D9"/><text x="89" y="171" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#946200">APPLY REVISION RULE</text></g>
<g transform="translate(615,330)"><rect width="240" height="190" rx="24" fill="#FFF" stroke="#D8D3CA"/><text x="24" y="40" font-family="Arial" font-size="13" font-weight="700" fill="#777">03 SUBSTITUTION</text><text x="24" y="78" font-family="Arial" font-size="24" font-weight="800" fill="#111">Swap priorities</text><text x="24" y="116" font-family="Arial" font-size="16" fill="#444">New item replaces an existing</text><text x="24" y="140" font-family="Arial" font-size="16" fill="#444">item of similar effort.</text><rect x="24" y="154" width="140" height="24" rx="12" fill="#E9F1FF"/><text x="94" y="171" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#3B65A2">CONFIRM TRADE-OFF</text></g>
<g transform="translate(895,330)"><rect width="240" height="190" rx="24" fill="#111"/><text x="24" y="40" font-family="Arial" font-size="13" font-weight="700" fill="#DDE9BC">04 ADDITIONAL SCOPE</text><text x="24" y="78" font-family="Arial" font-size="24" font-weight="800" fill="#FFF">More work</text><text x="24" y="116" font-family="Arial" font-size="16" fill="#DDD">Keep original plan and add</text><text x="24" y="140" font-family="Arial" font-size="16" fill="#DDD">new output/capacity.</text><text x="24" y="174" font-family="Arial" font-size="14" font-weight="700" fill="#DDE9BC">REPLACE · EXTEND · ADD</text></g>
<text x="64" y="580" font-family="Arial" font-size="18" fill="#555">The goal is not to stop change. It is to make the impact of change visible before execution.</text>
</svg>